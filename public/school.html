<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School Portal - SchoolFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
        color: #13233d;
      }
      .portal-header {
        background: linear-gradient(135deg, #0d6efd, #112f63);
        color: #fff;
        border-radius: 1.2rem;
      }
      .info-card {
        border-radius: 1rem;
        box-shadow: 0 12px 25px rgba(17, 47, 99, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="portal-header p-4 p-lg-5 mb-4">
        <p class="mb-2 text-white-50">School portal</p>
        <h1 id="schoolName" class="fw-bold">Loading school...</h1>
        <p id="packageSummary" class="mb-0"></p>
      </div>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="info-card bg-white p-4 h-100">
            <h4 class="fw-bold">School details</h4>
            <ul class="list-unstyled mt-3 mb-0">
              <li><strong>Admin:</strong> <span id="adminName"></span></li>
              <li><strong>Email:</strong> <span id="adminEmail"></span></li>
              <li><strong>Subdomain:</strong> <span id="subdomain"></span></li>
            </ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="info-card bg-white p-4 h-100">
            <h4 class="fw-bold">Trial status</h4>
            <p id="trialStatus" class="mt-3"></p>
            <p class="text-muted mb-0">This page is a starter sketch. You can extend it with academic, finance, and attendance modules as the product grows.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      async function loadSchool() {
        const response = await fetch('/api/school-by-subdomain');
        if (!response.ok) {
          document.body.innerHTML = '<div class="container py-5"><h1>School portal not found</h1></div>';
          return;
        }

        const data = await response.json();
        const school = data.school;

        document.getElementById('schoolName').textContent = school.school_name;
        document.getElementById('packageSummary').textContent = `${school.package_label} • ${school.trial_active ? 'Active trial' : 'Trial expired'}`;
        document.getElementById('adminName').textContent = school.admin_name;
        document.getElementById('adminEmail').textContent = school.school_email;
        document.getElementById('subdomain').textContent = school.subdomain;
        document.getElementById('trialStatus').textContent = `Trial ends on ${new Date(school.trial_ends_at).toLocaleDateString()}.`;
      }

      loadSchool();
    </script>
  </body>
</html>
